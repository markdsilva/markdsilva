<svg viewBox="0 0 480 230" role="img" aria-labelledby="amber-title amber-desc" xmlns="http://www.w3.org/2000/svg" width="480" height="230" font-family="Arial, Helvetica, sans-serif">
  <title id="amber-title">Mark Dsilva — browser tools and music</title>
  <desc id="amber-desc">A warm charcoal banner with spacious typography, a soft amber audio waveform, and one slow orbit. The text remains stationary.</desc>
  <defs>
    <linearGradient id="amber-surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fcf8f1" />
      <stop offset="1" stop-color="#f1e7d8" />
    </linearGradient>
    <radialGradient id="amber-atmosphere">
      <stop stop-opacity=".14" stop-color="#c56f32" />
      <stop offset=".55" stop-opacity=".065" stop-color="#c56f32" />
      <stop offset="1" stop-opacity="0" stop-color="#c56f32" />
    </radialGradient>
    <radialGradient id="amber-disc">
      <stop stop-opacity=".48" stop-color="#d9c5ad" />
      <stop offset="1" stop-opacity=".06" stop-color="#fcf8f1" />
    </radialGradient>
    <linearGradient id="amber-bars" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ce8343" />
      <stop offset=".5" stop-color="#bd652e" />
      <stop offset="1" stop-opacity=".52" stop-color="#934526" />
    </linearGradient>
    <clipPath id="amber-clip">
      <rect width="480" height="230" rx="20" />
    </clipPath>
  </defs>
  <g clip-path="url(#amber-clip)">
    <rect width="480" height="230" fill="url(#amber-surface)" />
    <g id="amber-art" transform="translate(408 116) scale(.54)">
      <ellipse rx="226" ry="210" fill="url(#amber-atmosphere)" />
      <circle r="93" fill="url(#amber-disc)" />
      <circle r="104" fill="none" stroke-width=".85" stroke="#bd652e" opacity=".18" />
      <circle r="84" fill="none" stroke-width=".7" stroke="#d9c5ad" opacity=".75" />
      <circle r="64" fill="none" stroke-width=".7" stroke="#d9c5ad" opacity=".40" />
      <g id="amber-signal" fill="url(#amber-bars)">
        <rect x="-72" y="-10.000" width="4" height="20.000" rx="2" />
        <rect x="-62" y="-15.660" width="4" height="31.320" rx="2" />
        <rect x="-52" y="-23.493" width="4" height="46.986" rx="2" />
        <rect x="-42" y="-31.553" width="4" height="63.106" rx="2" />
        <rect x="-32" y="-24.155" width="4" height="48.311" rx="2" />
        <rect x="-22" y="-16.589" width="4" height="33.178" rx="2" />
        <rect x="-12" y="-29.919" width="4" height="59.839" rx="2" />
        <rect x="-2" y="-40.769" width="4" height="81.539" rx="2" />
        <rect x="8" y="-35.707" width="4" height="71.413" rx="2" />
        <rect x="18" y="-23.022" width="4" height="46.044" rx="2" />
        <rect x="28" y="-16.729" width="4" height="33.458" rx="2" />
        <rect x="38" y="-26.819" width="4" height="53.639" rx="2" />
        <rect x="48" y="-36.422" width="4" height="72.844" rx="2" />
        <rect x="58" y="-22.403" width="4" height="44.805" rx="2" />
        <rect x="68" y="-13.050" width="4" height="26.100" rx="2" />
      </g>
      <g id="amber-orbit">
        <path d="M-51.3 -90.5 A104 104 0 0 1 0 -104" fill="none" stroke-width="1.35" stroke-linecap="round" stroke="#bd652e" opacity=".25" />
        <circle cx="0" cy="-104" r="7" fill="#bd652e" opacity=".10" />
        <circle cx="0" cy="-104" r="2.8" fill="#bd652e" />
      </g>
    </g>
    <path id="amber-signature" d="M29 77h22" stroke-width="2.2" stroke-linecap="round" stroke="#bd652e" opacity=".8" />
    <text id="amber-name" x="26" y="123" font-size="46" font-weight="600" letter-spacing="-1.7" fill="#30241c">Mark Dsilva<tspan fill="#bd652e">.</tspan>
    </text>
    <text id="amber-subtitle" x="28" y="155" font-size="17" font-weight="400" letter-spacing=".15" fill="#796352">Browser tools &amp; music.</text>
  </g>
  <rect id="amber-outline" x=".5" y=".5" width="479" height="229" rx="20" fill="none" stroke-width="1" stroke="#d9c5ad" opacity=".7" />
</svg>
